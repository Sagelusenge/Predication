name: Réveiller le service pour le verset du jour

on:
  schedule:
    # 07:00 à Lubumbashi (UTC+2, sans changement saisonnier).
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  wake-render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Réveiller l’application et déclencher le message quotidien
        run: curl --fail --silent --show-error --retry 8 --retry-delay 15 --max-time 180 https://predication-cbca.onrender.com/api/v1/health/ready
